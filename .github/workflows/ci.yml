name: CI — testes + relatório de evidência

# ADR-003: evidência de teste gerada por máquina e verificada, nunca narrada.
#
# Três jobs (card #34):
#   test — roda em TODO PR: runners unitários/integração (regras/banco/tela-componente),
#          gera reports/TESTS.md a partir do --json e barra o merge se o relatório
#          commitado divergir de uma execução limpa (guarda anti-drift). NÃO roda E2E.
#   e2e  — sobe o app Electron de verdade (build + xvfb + keyring + Playwright). Custa
#          ~15 min e prova a fronteira preload/IPC/janela, que muda raramente. Só EXECUTA
#          quando o PR toca essa fronteira (ver o job `changes`); nos demais é no-op verde.
#   gate — required check único. Sempre roda; agrega `test` e `e2e`. Falha se `test` falhou
#          ou se o `e2e` rodou e falhou; passa quando o E2E foi legitimamente pulado. É ele,
#          não `e2e`, que a branch protection exige — assim o E2E condicional nunca fica
#          "pending eterno" bloqueando o merge (a armadilha do required check pulado).
#
# GARANTIA (card #34): o E2E completo tem de rodar no caminho para a `main`. O filtro por
# paths abaixo cobre toda a fronteira que o E2E prova — preload, entrada do main, janela e a
# própria suíte. PR que mexe nela roda o E2E e é barrado se falhar; PR que não mexe não pode
# introduzir regressão de fronteira. Falso verde é pior que teste ausente.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detecta se o PR toca a fronteira que o E2E prova. Job leve (só git), sem action de
  # terceiros: `paths:` no evento `pull_request` cancelaria o workflow inteiro (não um job),
  # então o filtro vive aqui, num step, e vira output que o `e2e` consulta no seu `if:`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontier: ${{ steps.filter.outputs.frontier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          # A fronteira preload/IPC/janela + a própria suíte E2E. Qualquer alteração aqui
          # exige o E2E completo. Mudar esta lista é mudar o que a garantia cobre — mantê-la
          # em sincronia com o que o E2E realmente prova é parte do contrato do card #34.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- \
            'src/main/preload/**' \
            'src/main/index.ts' \
            'src/main/window.ts' \
            'tests/e2e/**' \
            'playwright.config.ts' || true)
          if [ -n "$changed" ]; then
            echo "frontier=true" >> "$GITHUB_OUTPUT"
            echo "PR toca a fronteira do E2E — o job e2e vai rodar:"
            printf '%s\n' "$changed"
          else
            echo "frontier=false" >> "$GITHUB_OUTPUT"
            echo "PR não toca a fronteira do E2E — job e2e pulado (no-op verde no gate)."
          fi

  test:
    runs-on: ubuntu-latest
    # Sem `services:`: a maior parte da categoria "Banco" testa o storage local (SQLite em
    # arquivo temporário), que não é serviço (docs/TESTING.md §6). A exceção é o Supabase
    # local, que sobe abaixo pela CLI — `services:` não serviria, porque não é um container
    # só, e sim a stack inteira que a CLI orquestra.
    env:
      REPORT_PR: '#${{ github.event.pull_request.number }}'
      # O GitHub já tem a URL pronta — o gerador não precisa saber montar link
      # de GitHub (segue repo-agnóstico, docs/TESTING.md §7).
      REPORT_PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4

      # A ISSUE da fatia sai do `refs #N` do corpo do PR — NÃO é o número do PR
      # (`closes #N` é proibido pelo CLAUDE.md, então `refs #N` é o elo canônico
      # PR→issue). Sem `refs #N` no corpo → '—', e o gerador segue verdadeiro
      # nos números. A SPEC sai do link para docs/spec/spec-*.md, quando há.
      - name: Metadados da entrega (issue, spec, data)
        env:
          # Via env, nunca interpolado no script: o corpo do PR é texto de
          # usuário e ${{ }} direto no `run` seria injeção de shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          issue=$(printf '%s' "$PR_BODY" | grep -oiE 'refs #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          # A SPEC sai do TÍTULO, não do corpo: o corpo cita outras specs em
          # prosa (contexto, comparação) e o `head -1` pegava a primeira menção,
          # não a da entrega. Fallback para o corpo mantém os PRs antigos
          # funcionando; sem nenhuma das duas, fica '—' e o relatório segue
          # verdadeiro nos números.
          spec=$(printf '%s' "$PR_TITLE" | grep -oE 'spec-[a-z-]+-[0-9]{2}[a-z]?-[a-z-]+' | head -1 || true)
          if [ -z "$spec" ]; then
            spec=$(printf '%s' "$PR_BODY" | grep -oE 'spec-[a-z-]+-[0-9]{2}[a-z]?-[a-z-]+' | head -1 || true)
          fi
          echo "REPORT_ISSUE=${issue:+#$issue}" >> "$GITHUB_ENV"
          echo "REPORT_SPEC=${spec:-}" >> "$GITHUB_ENV"
          echo "REPORT_DATE=$(date -u -d "$PR_UPDATED_AT" +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint e typecheck
        run: |
          npm run lint
          npm run typecheck

      # Prova visual dos controles (SPEC-DesignSystem-03a): sobe a galeria num Chromium de
      # verdade e mede o que jsdom não mede — altura real dos controles, contraste computado,
      # fontes carregadas, anel de foco pintado. Barata (~5s) e pega classe de defeito que
      # nenhum teste de papel pega. É Chromium headless, não o Electron: fica no job `test`,
      # não no `e2e` (que sobe o app empacotado). Ver docs/TESTING.md.
      #
      # `--with-deps chromium` e não o browser inteiro: só o Chromium é usado aqui.
      - name: Instalar o Chromium do Playwright (galeria de prova)
        run: npx playwright install --with-deps chromium

      - name: Prova visual dos controles
        run: npm run test:prova

      # SPEC-Execucao-01, critério 6: o int-spec de RLS exercita a stack real, então o CI
      # a sobe. Sem este step o arquivo **passaria pulando** — os testes se pulam quando a
      # stack não responde (para não punir quem clona sem Docker), e o CI ficaria verde
      # exatamente onde deveria provar o isolamento. Falso verde é pior que teste ausente:
      # o relatório contaria RLS como coberta.
      #
      # `supabase start` já aplica migrations e seed do diretório versionado.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir o Supabase local (RLS do int-spec)
        run: supabase start

      # O append-only é verificado contra a BASE do PR, não contra HEAD: aqui
      # HEAD é o merge commit, cujo TESTS.md é a versão do próprio PR — a guarda
      # estaria conferindo o arquivo contra si mesmo. Fetch raso só dessa ref.
      - name: Buscar a base do PR (baseline do append-only)
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      # Self-check do gerador: prova que a própria guarda funciona (append-only,
      # CRLF, histórico zerado). Sem isto, um bug no gerador desliga a guarda em
      # silêncio — foi assim que o registro de uma spec inteira sumiu no proplan
      # sob CI verde.
      - name: Self-check do gerador de relatório
        run: npm run test:report:selfcheck

      # Guarda anti-drift: roda os runners e compara os números frescos com o
      # reports/TESTS.md COMMITADO no PR. Se alguém editou um número à mão (ou
      # esqueceu de rodar `npm run test:report` e commitar), diverge → falha aqui.
      # NÃO reescreve o arquivo — senão nunca pegaria a forja do commit.
      # O carimbo (linha no histórico) só é exigido de PR que MEXE em teste —
      # PR só de docs não deve ser barrado. Globs = a convenção deste repo
      # (vitest.config.ts): `*.spec.ts` (regras), `*.int-spec.ts` (banco),
      # `*.test.tsx` (tela). `*.selfcheck.mjs` entra porque é o teste do próprio
      # gerador e não casa os outros — sem ele, um PR que só mexe na guarda se
      # dispensaria da própria regra. `*.e2e.ts` entra porque alterar a suíte E2E
      # é alterar teste, mesmo que o E2E rode noutro job.
      - name: O PR altera testes?
        run: |
          set -euo pipefail
          # Diff de DOIS pontos: `...` (três) precisa do ancestral comum, que o
          # fetch raso (--depth=1) não traz — daria "fatal: no merge base",
          # variável vazia e a guarda se dispensando sozinha, em verde. Guarda
          # que falha ABERTA é pior que guarda nenhuma. `--diff-filter=d` ignora
          # arquivo removido: apagar um spec não cria entrega a carimbar.
          changed=$(git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}..HEAD" \
            -- '*.spec.ts' '*.int-spec.ts' '*.test.ts' '*.test.tsx' '*.e2e.ts' '*.selfcheck.mjs')
          if [ -n "$changed" ]; then
            echo "REQUIRE_ENTRY=1" >> "$GITHUB_ENV"
            echo "PR altera testes — o carimbo no histórico será exigido:"
            printf '%s\n' "$changed"
          else
            echo "PR não altera teste — carimbo dispensado."
          fi

      # A categoria "Tela" do relatório é só vitest-componente (jsdom) — o E2E saiu daqui
      # (card #34, vive no job `e2e`). O relatório não precisa mais de xvfb, keyring,
      # setuid nem do build do app: tudo isso migrou para o job `e2e`.
      - name: Rodar testes + guarda anti-drift
        env:
          REPORT_BASE_REF: origin/${{ github.base_ref }}
        run: npm run test:report:check

      # Terceira guarda: números certos + histórico íntegro ainda deixavam
      # passar uma entrega SEM linha no histórico — no repo de origem duas
      # entregas mergearam com a tabela sugerindo que não tiveram teste. Roda
      # depois do --check para que a falha de números apareça antes.
      - name: Guarda — a entrega está carimbada no histórico?
        if: env.REQUIRE_ENTRY == '1'
        run: npm run test:report:check -- --require-entry

      - name: Publicar tabela no job summary
        if: always()
        run: |
          {
            echo "## Relatório de testes (ADR-003)"
            echo ""
            sed -n '/## Estado atual/,/## Histórico/p' reports/TESTS.md | sed '/## Histórico/d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentário fixo no PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(sed -n '/## Estado atual/,/## Histórico/p' reports/TESTS.md | sed '/## Histórico/d')
          MARKER="<!-- test-report-sticky -->"
          COMMENT="$MARKER"$'\n'"$BODY"
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq \
            ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$COMMENT"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$COMMENT"
          fi

  # E2E Electron completo. Só executa quando o PR toca a fronteira (job `changes`). Todos os
  # steps de ambiente que antes viviam no job único migraram para cá — são o que o E2E, e só
  # o E2E, exige. As armadilhas de cada um estão em docs/TESTING.md §3.1.
  e2e:
    needs: changes
    if: needs.changes.outputs.frontier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O E2E sobe o Electron de verdade (SPEC-Fundacao-03, critério 9), e no Linux
      # do CI isso exige as libs de sistema que o Playwright instala.
      - name: Instalar dependências de sistema do Playwright
        run: npx playwright install-deps

      # Cache do binário do Electron (~100 MB). O download acontece a cada run porque o
      # `postinstall` é `electron-rebuild` (compila o better-sqlite3), que não baixa o
      # binário — quem baixa é o step abaixo. A chave inclui a versão do Electron do
      # lockfile: subir o Electron invalida o cache sozinho, sem chave manual a manter.
      # `restore-keys` reaproveita um cache de versão anterior enquanto o novo não existe.
      - name: Cache do binário do Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Baixa o binário do Electron ANTES dos testes (no-op quando o cache acima acerta).
      # Sem isto o download de ~100 MB acontecia dentro do primeiro teste, estourando os
      # 30s do `firstWindow()`. O sintoma engana: o processo sobe e a janela nunca abre,
      # sem erro de biblioteca no log. Fora do teste, o tempo de download não conta no timeout.
      - name: Baixar o binário do Electron
        run: node node_modules/electron/install.js

      # O `chrome-sandbox` que vem no pacote npm não tem as permissões que o Chromium
      # exige no Linux (dono root, modo 4755) — o npm não preserva setuid. Sem isto o
      # processo aborta no boot, ANTES de criar janela:
      #
      #   FATAL:setuid_sandbox_host.cc:166] The SUID sandbox helper binary was found,
      #   but is not configured correctly. (…) exited with signal SIGTRAP
      #
      # O sintoma engana: o E2E só mostra "timeout esperando o evento window", porque
      # o stderr do processo não chega ao reporter do Playwright.
      #
      # A alternativa seria subir com `--no-sandbox`, e ela está DESCARTADA: o sandbox
      # do renderer é critério de aceite da SPEC-Fundacao-03 (a mesma razão que mantém
      # o preload em .cjs). Desligá-lo no CI faria a suíte passar exatamente onde ela
      # deveria provar a fronteira — teste verde sobre a garantia ausente.
      - name: Ajustar permissões do chrome-sandbox (setuid)
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # O runner não tem D-Bus de sessão nem keyring, então o backend de senha do
      # Chromium cai em `basic_text` e `safeStorage.isEncryptionAvailable()` responde
      # false. O boot então falha ALTO por desenho (ADR-004: a chave de auditoria nunca
      # vai ao disco em claro) e a janela não nasce — o E2E vê só "timeout esperando
      # window"; o erro real só aparece no stderr do processo principal.
      #
      # A saída é dar ao CI um keyring REAL: gnome-keyring destravado sobre um D-Bus de
      # sessão. Afrouxar o código (gravar em claro sob flag de teste) está DESCARTADO
      # pela mesma razão do sandbox acima: a suíte passaria exatamente onde deveria
      # provar a garantia. Os daemons sobrevivem ao fim do step; os steps seguintes só
      # precisam do endereço do bus e do desktop declarado — sem XDG_CURRENT_DESKTOP o
      # Chromium nem tenta o libsecret e volta ao basic_text.
      # O daemon precisa viver NO MESMO comando que roda os testes: sessão D-Bus e
      # keyring iniciados num step anterior não são confiáveis aqui (o primeiro run com
      # eval $(dbus-launch) + GITHUB_ENV chegou com o bus certo e o safeStorage seguiu
      # indisponível). `dbus-run-session` cria o bus, o unlock com senha vazia cria e
      # destrava o keyring "login", e o processo de teste herda tudo por descendência.
      - name: Keyring real para o safeStorage (ADR-004)
        run: |
          sudo apt-get install -y gnome-keyring libsecret-tools
          echo "XDG_CURRENT_DESKTOP=GNOME" >> "$GITHUB_ENV"
          # O Chromium grava na collection *default*. Criar keyring/collection em
          # runtime exige o SystemPrompter (GUI), que morre no runner — e o --login com
          # senha vazia não materializa o arquivo. Então o keyring inteiro é semeado no
          # disco: sem hash de senha o formato é texto claro e nasce DESTRAVADO — para
          # segredo descartável de CI, é exatamente o que se quer.
          mkdir -p "$HOME/.local/share/keyrings"
          printf '%s\n' '[keyring]' 'display-name=Default keyring' 'ctime=0' 'mtime=0' \
            'lock-on-idle=false' 'lock-after=false' \
            > "$HOME/.local/share/keyrings/Default_keyring.keyring"
          printf Default_keyring > "$HOME/.local/share/keyrings/default"

      # O E2E sobe o app EMPACOTADO (`out/`), não o servidor de dev — sem build, testaria
      # a versão anterior do código.
      - name: Build do app
        run: npm run build

      # `xvfb-run`: o Electron abre janela — sem display virtual o launch falha no Linux
      # do CI (docs/TESTING.md §3.1). O keyring destravado vive no mesmo comando que roda
      # os testes (ver o step do keyring acima).
      - name: Rodar E2E Electron
        run: |
          dbus-run-session -- bash -c '
            rm -rf "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/keyring"
            eval "$(gnome-keyring-daemon --components=secrets --daemonize)"
            echo -n teste | secret-tool store --label=sonda sonda ci \
              && echo "secret-tool OK" || echo "secret-tool FALHOU — Electron vai falhar"
            exec xvfb-run --auto-servernum npx playwright test
          '

  # Required check único (branch protection exige `gate`, não `e2e`). Sempre roda —
  # `if: always()` — e agrega os resultados: falha se `test` falhou, ou se `e2e` RODOU e
  # falhou. Passa quando `e2e` foi legitimamente pulado (`result == 'skipped'`), que é o
  # que impede o E2E condicional de bloquear o merge em "pending eterno". Um E2E que falha
  # de verdade tem `result == 'failure'` e derruba o gate — a garantia do card #34 fica de pé.
  gate:
    needs: [test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Agregar resultados
        env:
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "test = $TEST_RESULT"
          echo "e2e  = $E2E_RESULT"
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::O job test nao passou ($TEST_RESULT)."
            exit 1
          fi
          # `e2e` é aceitável em success (rodou e passou) ou skipped (PR não toca a fronteira).
          # Qualquer outra coisa — failure, cancelled — barra o merge.
          if [ "$E2E_RESULT" != "success" ] && [ "$E2E_RESULT" != "skipped" ]; then
            echo "::error::O job e2e rodou e nao passou ($E2E_RESULT)."
            exit 1
          fi
          echo "Gate verde: test OK; e2e $E2E_RESULT (aceitável)."
