name: CI — testes + relatório de evidência

# ADR-003: evidência de teste gerada por máquina e verificada, nunca narrada.
# Roda em todo PR: executa os runners, gera reports/TESTS.md a partir do --json,
# publica no job summary + comentário fixo do PR, e barra o merge se o relatório
# commitado divergir de uma execução limpa (guarda anti-drift).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Sem services: a categoria "Banco" testa o storage local (SQLite em arquivo
    # temporário, a partir da Fatia 04), que não é serviço (docs/TESTING.md §6).
    env:
      REPORT_PR: '#${{ github.event.pull_request.number }}'
      # O GitHub já tem a URL pronta — o gerador não precisa saber montar link
      # de GitHub (segue repo-agnóstico, docs/TESTING.md §7).
      REPORT_PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4

      # A ISSUE da fatia sai do `refs #N` do corpo do PR — NÃO é o número do PR
      # (`closes #N` é proibido pelo CLAUDE.md, então `refs #N` é o elo canônico
      # PR→issue). Sem `refs #N` no corpo → '—', e o gerador segue verdadeiro
      # nos números. A SPEC sai do link para docs/spec/spec-*.md, quando há.
      - name: Metadados da entrega (issue, spec, data)
        env:
          # Via env, nunca interpolado no script: o corpo do PR é texto de
          # usuário e ${{ }} direto no `run` seria injeção de shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          issue=$(printf '%s' "$PR_BODY" | grep -oiE 'refs #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          # A SPEC sai do TÍTULO, não do corpo: o corpo cita outras specs em
          # prosa (contexto, comparação) e o `head -1` pegava a primeira menção,
          # não a da entrega. Fallback para o corpo mantém os PRs antigos
          # funcionando; sem nenhuma das duas, fica '—' e o relatório segue
          # verdadeiro nos números.
          spec=$(printf '%s' "$PR_TITLE" | grep -oE 'spec-[a-z-]+-[0-9]{2}[a-z]?-[a-z-]+' | head -1 || true)
          if [ -z "$spec" ]; then
            spec=$(printf '%s' "$PR_BODY" | grep -oE 'spec-[a-z-]+-[0-9]{2}[a-z]?-[a-z-]+' | head -1 || true)
          fi
          echo "REPORT_ISSUE=${issue:+#$issue}" >> "$GITHUB_ENV"
          echo "REPORT_SPEC=${spec:-}" >> "$GITHUB_ENV"
          echo "REPORT_DATE=$(date -u -d "$PR_UPDATED_AT" +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O E2E sobe o Electron de verdade (SPEC-Fundacao-03, critério 9), e no Linux
      # do CI isso exige as libs de sistema que o Playwright instala.
      - name: Instalar dependências de sistema do Playwright
        run: npx playwright install-deps

      # Baixa o binário do Electron ANTES dos testes. O `postinstall` do projeto é
      # `electron-rebuild` (compila o better-sqlite3), que **não** baixa o binário — e o
      # download de ~100 MB acontecia dentro do primeiro teste, estourando os 30s do
      # `firstWindow()`. O sintoma engana: o processo sobe e a janela nunca abre, sem
      # erro de biblioteca no log. Fora do teste, o tempo de download não conta no timeout.
      - name: Baixar o binário do Electron
        run: node node_modules/electron/install.js

      # `npm run build` = typecheck + `electron-vite build`. O build é o que produz
      # `out/main/index.js`, o `main` do package.json — e `out/` é gitignored, então
      # no runner ele só existe se for construído aqui. Sem este passo o Electron sobe
      # apontando para um arquivo inexistente, o processo morre e o `firstWindow()` do
      # E2E espera a janela até estourar 30s. O sintoma engana igual ao do binário
      # acima: timeout de janela, nenhum erro de módulo no log.
      - name: Lint e build (typecheck + bundle do Electron)
        run: |
          npm run lint
          npm run build

      # O append-only é verificado contra a BASE do PR, não contra HEAD: aqui
      # HEAD é o merge commit, cujo TESTS.md é a versão do próprio PR — a guarda
      # estaria conferindo o arquivo contra si mesmo. Fetch raso só dessa ref.
      - name: Buscar a base do PR (baseline do append-only)
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      # Self-check do gerador: prova que a própria guarda funciona (append-only,
      # CRLF, histórico zerado). Sem isto, um bug no gerador desliga a guarda em
      # silêncio — foi assim que o registro de uma spec inteira sumiu no proplan
      # sob CI verde.
      - name: Self-check do gerador de relatório
        run: npm run test:report:selfcheck

      # Guarda anti-drift: roda os runners e compara os números frescos com o
      # reports/TESTS.md COMMITADO no PR. Se alguém editou um número à mão (ou
      # esqueceu de rodar `npm run test:report` e commitar), diverge → falha aqui.
      # NÃO reescreve o arquivo — senão nunca pegaria a forja do commit.
      # O carimbo (linha no histórico) só é exigido de PR que MEXE em teste —
      # PR só de docs não deve ser barrado. Globs = a convenção deste repo
      # (vitest.config.ts): `*.spec.ts` (regras), `*.int-spec.ts` (banco),
      # `*.test.tsx` (tela). `*.selfcheck.mjs` entra porque é o teste do próprio
      # gerador e não casa os outros — sem ele, um PR que só mexe na guarda se
      # dispensaria da própria regra.
      - name: O PR altera testes?
        run: |
          set -euo pipefail
          # Diff de DOIS pontos: `...` (três) precisa do ancestral comum, que o
          # fetch raso (--depth=1) não traz — daria "fatal: no merge base",
          # variável vazia e a guarda se dispensando sozinha, em verde. Guarda
          # que falha ABERTA é pior que guarda nenhuma. `--diff-filter=d` ignora
          # arquivo removido: apagar um spec não cria entrega a carimbar.
          changed=$(git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}..HEAD" \
            -- '*.spec.ts' '*.int-spec.ts' '*.test.ts' '*.test.tsx' '*.e2e.ts' '*.selfcheck.mjs')
          if [ -n "$changed" ]; then
            echo "REQUIRE_ENTRY=1" >> "$GITHUB_ENV"
            echo "PR altera testes — o carimbo no histórico será exigido:"
            printf '%s\n' "$changed"
          else
            echo "PR não altera teste — carimbo dispensado."
          fi

      # DIAGNÓSTICO TEMPORÁRIO: sobe o app fora do Playwright e mostra o stderr cru.
      # O `firstWindow()` só reporta "timeout esperando window" — o motivo real de o
      # processo não abrir janela fica no stderr, que o reporter do Playwright engole.
      # Remover assim que a causa estiver identificada.
      - name: Diagnóstico — subir o Electron e capturar stderr
        continue-on-error: true
        run: |
          set -x
          ls -la out/main/index.js out/preload/index.cjs out/renderer/index.html
          timeout 30 xvfb-run --auto-servernum \
            node_modules/.bin/electron . --user-data-dir=/tmp/diag 2>&1 | head -60 || true

      # `xvfb-run`: o orquestrador roda o E2E, e o Electron abre janela — sem display
      # virtual o launch falha no Linux do CI (docs/TESTING.md §3.1).
      - name: Rodar testes + guarda anti-drift
        env:
          REPORT_BASE_REF: origin/${{ github.base_ref }}
        run: xvfb-run --auto-servernum npm run test:report:check

      # Terceira guarda: números certos + histórico íntegro ainda deixavam
      # passar uma entrega SEM linha no histórico — no repo de origem duas
      # entregas mergearam com a tabela sugerindo que não tiveram teste. Roda
      # depois do --check para que a falha de números apareça antes.
      - name: Guarda — a entrega está carimbada no histórico?
        if: env.REQUIRE_ENTRY == '1'
        run: xvfb-run --auto-servernum npm run test:report:check -- --require-entry

      - name: Publicar tabela no job summary
        if: always()
        run: |
          {
            echo "## Relatório de testes (ADR-003)"
            echo ""
            sed -n '/## Estado atual/,/## Histórico/p' reports/TESTS.md | sed '/## Histórico/d'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentário fixo no PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(sed -n '/## Estado atual/,/## Histórico/p' reports/TESTS.md | sed '/## Histórico/d')
          MARKER="<!-- test-report-sticky -->"
          COMMENT="$MARKER"$'\n'"$BODY"
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --jq \
            ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -f body="$COMMENT"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$COMMENT"
          fi
