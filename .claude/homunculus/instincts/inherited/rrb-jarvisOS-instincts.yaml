confidence: 1.0
domain: git
source: repository-contract
---

# Entrega por PR

## Action

Trabalhe em branch/worktree, use `refs #N` e nunca use palavras que fechem automaticamente a issue. Verifique o CI atual antes do merge. Após integrar, mova para `proplan:done`; somente o PI fecha a issue.

